<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งลิงค์ประจำเดือน & แดชบอร์ด Real-time - ทีมขาย</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Sarabun', sans-serif; }
        .main-card { max-width: 800px; margin: 30px auto; border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .nav-pills .nav-link { font-weight: 600; color: #555; border-radius: 10px; padding: 10px 24px; }
        .nav-pills .nav-link.active { background-color: #0d6efd; color: white; }
        .stat-card { border-radius: 12px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="card main-card p-4 bg-white">
        
        <!-- เมนูสลับหน้า (Tabs) -->
        <ul class="nav nav-pills nav-justified mb-4" id="mainTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="form-tab" data-bs-toggle="tab" data-bs-target="#form-pane" type="button" role="tab">
                    <i class="fa-solid fa-paper-plane me-2"></i>ฟอร์มส่งลิงค์
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard-pane" type="button" role="tab" onclick="fetchDashboardData()">
                    <i class="fa-solid fa-chart-pie me-2"></i>แดชบอร์ดสรุปผล
                </button>
            </li>
        </ul>

        <div class="tab-content" id="mainTabContent">
            
            <!-- ================= PAGE 1: ฟอร์มส่งลิงก์ ================= -->
            <div class="tab-pane fade show active" id="form-pane" role="tabpanel">
                <h4 class="text-center mb-4 text-primary fw-bold">ฟอร์มส่งลิงค์ประจำเดือน</h4>
                
                <!-- 📌 วาง Web App URL ตัวใหม่ใน action="..." -->
                <form id="salesForm" action="https://script.google.com/macros/s/AKfycbwycEQDIFvrIvnVHM6XkGqonYtZ_fRnZdSTbi05qvK4afHolQTekPEfBnnQjIjzZw58/exec" method="POST" target="hidden_iframe">
                    
                    <!-- ช่องชื่อเซลล์ (เลือกจาก 5 รายชื่อ) -->
                    <div class="mb-3">
                        <label for="salesName" class="form-label fw-semibold">ชื่อเซลล์ <span class="text-danger">*</span></label>
                        <select class="form-select" name="salesName" id="salesName" required>
                            <option value="" selected disabled>-- เลือกรายชื่อผู้ส่ง --</option>
                            <option value="น้องนานา">น้องนานา</option>
                            <option value="เซลล์กิ๊ฟ">เซลล์กิ๊ฟ</option>
                            <option value="เซลล์บอย">เซลล์บอย</option>
                            <option value="เซลล์มุก">เซลล์มุก</option>
                            <option value="เซลล์เอก">เซลล์เอก</option>
                        </select>
                    </div>

                    <div class="row">
                        <!-- ช่องเดือน -->
                        <div class="col-md-6 mb-3">
                            <label for="month" class="form-label fw-semibold">ประจำเดือน <span class="text-danger">*</span></label>
                            <select class="form-select" name="month" id="month" required>
                                <option value="" selected disabled>เลือกเดือน</option>
                                <option value="มกราคม">มกราคม</option>
                                <option value="กุมภาพันธ์">กุมภาพันธ์</option>
                                <option value="มีนาคม">มีนาคม</option>
                                <option value="เมษายน">เมษายน</option>
                                <option value="พฤษภาคม">พฤษภาคม</option>
                                <option value="มิถุนายน">มิถุนายน</option>
                                <option value="กรกฎาคม">กรกฎาคม</option>
                                <option value="สิงหาคม">สิงหาคม</option>
                                <option value="กันยายน">กันยายน</option>
                                <option value="ตุลาคม">ตุลาคม</option>
                                <option value="พฤศจิกายน">พฤศจิกายน</option>
                                <option value="ธันวาคม">ธันวาคม</option>
                            </select>
                        </div>

                        <!-- ช่อง พ.ศ. -->
                        <div class="col-md-6 mb-3">
                            <label for="year" class="form-label fw-semibold">พ.ศ. <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" name="year" id="year" required placeholder="เช่น 2569" value="2569">
                        </div>
                    </div>

                    <!-- ช่อง URL -->
                    <div class="mb-4">
                        <label for="linkUrl" class="form-label fw-semibold">ลิงค์ที่ต้องการส่ง (URL) <span class="text-danger">*</span></label>
                        <input type="url" class="form-control" name="linkUrl" id="linkUrl" required placeholder="https://example.com/mypath">
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fs-6 fw-bold">บันทึกข้อมูล</button>
                </form>

                <!-- แสดงสถานะการส่ง -->
                <div id="statusMessage" class="mt-3 text-center" style="display:none;"></div>
            </div>


            <!-- ================= PAGE 2: แดชบอร์ด Real-time ================= -->
            <div class="tab-pane fade" id="dashboard-pane" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="text-primary fw-bold mb-0">แดชบอร์ดสรุปการส่งลิงก์ (Real-time)</h4>
                    <button class="btn btn-sm btn-outline-primary" onclick="fetchDashboardData()">
                        <i class="fa-solid fa-rotate-right me-1"></i>รีเฟรชข้อมูล
                    </button>
                </div>
                
                <!-- การ์ดสรุปตัวเลข -->
                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <div class="card stat-card bg-primary text-white p-3 text-center">
                            <small>การส่งลิงก์ทั้งหมด</small>
                            <h2 class="fw-bold mb-0" id="totalSubmissions">-</h2>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="card stat-card bg-success text-white p-3 text-center">
                            <small>จำนวนผู้ส่งทั้งหมด</small>
                            <h2 class="fw-bold mb-0" id="activeSalesCount">-</h2>
                        </div>
                    </div>
                </div>

                <!-- ตารางสรุปจำนวนแยกตามเซลล์ -->
                <div class="card border-0 shadow-sm p-3 mb-3">
                    <h6 class="fw-bold mb-3"><i class="fa-solid fa-list-ol me-2 text-primary"></i>สรุปจำนวนตามรายชื่อ</h6>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ชื่อเซลล์</th>
                                    <th class="text-center">จำนวนลิงค์ที่ส่ง</th>
                                    <th>สัดส่วนการส่ง</th>
                                </tr>
                            </thead>
                            <tbody id="dashboardTableBody">
                                <tr>
                                    <td colspan="3" class="text-center text-muted py-3">กำลังโหลดข้อมูลจาก Google Sheets...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Hidden Iframe ป้องกันปัญหา CORS Cross-domain เวลาส่งฟอร์ม -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 📌 ใส่ Web App URL ตัวเดียวกันที่นี่ด้วยนะคระ
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwycEQDIFvrIvnVHM6XkGqonYtZ_fRnZdSTbi05qvK4afHolQTekPEfBnnQjIjzZw58/exec";
    let isSubmitting = false;

    // โหลดข้อมูลแดชบอร์ดอัตโนมัติเมื่อเปิดหน้าเว็บ
    document.addEventListener('DOMContentLoaded', function() {
        fetchDashboardData();
    });

    // เมื่อเริ่มส่งฟอร์ม
    document.getElementById('salesForm').addEventListener('submit', function() {
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMessage');

        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.innerText = 'กำลังบันทึกข้อมูล...';
        statusMsg.style.display = 'none';
    });

    // เมื่อ Iframe ได้รับ Response กลับมา (แปลว่าบันทึกลง Sheet สำเร็จแล้ว)
    document.getElementById('hidden_iframe').addEventListener('load', function() {
        if (isSubmitting) {
            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');

            statusMsg.className = 'mt-3 text-center alert alert-success';
            statusMsg.innerText = '✅ บันทึกข้อมูลสำเร็จและอัปเดตแดชบอร์ดแล้ว!';
            statusMsg.style.display = 'block';

            document.getElementById('salesForm').reset();
            submitBtn.disabled = false;
            submitBtn.innerText = 'บันทึกข้อมูล';
            isSubmitting = false;

            // ดึงข้อมูลใหม่จาก Google Sheets มาอัปเดตแดชบอร์ดทันที
            setTimeout(fetchDashboardData, 1000);
        }
    });

    // ฟังก์ชันดึงข้อมูลแบบ Real-time จาก Google Apps Script (doGet)
    function fetchDashboardData() {
        const tableBody = document.getElementById('dashboardTableBody');
        tableBody.innerHTML = `<tr><td colspan="3" class="text-center text-muted py-3"><i class="fa-solid fa-spinner fa-spin me-2"></i>กำลังดึงข้อมูลล่าสุด...</td></tr>`;

        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                const stats = data.stats || {};
                const totalCount = data.totalSubmissions || 0;
                
                document.getElementById('totalSubmissions').innerText = totalCount;

                const salesList = ['ดรีม', 'เบิร์ท', 'ต้อม', 'เอิร์ท', 'ปูนิ่ม'];
                let activeSales = 0;
                salesList.forEach(name => {
                    if ((stats[name] || 0) > 0) activeSales++;
                });
                document.getElementById('activeSalesCount').innerText = activeSales;

                tableBody.innerHTML = '';
                salesList.forEach(name => {
                    const count = stats[name] || 0;
                    const percentage = totalCount > 0 ? ((count / totalCount) * 100).toFixed(0) : 0;

                    const row = `
                        <tr>
                            <td class="fw-bold text-secondary">${name}</td>
                            <td class="text-center fw-bold fs-5">${count}</td>
                            <td style="width: 40%;">
                                <div class="progress" style="height: 10px;">
                                    <div class="progress-bar bg-primary" role="progressbar" style="width: ${percentage}%"></div>
                                </div>
                                <small class="text-muted">${percentage}%</small>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Error fetching dashboard data:', error);
                tableBody.innerHTML = `<tr><td colspan="3" class="text-center text-danger py-3">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
            });
    }
</script>

</body>
</html>
